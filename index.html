<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Social links profile</title>

</head>
<body>
<main>
  <article>
    <div class="profile"> 
      <img src="assets/images/avatar-jessica.jpeg" alt="Jessica's avatar">
      <div class="info">
        <h1 class="hero-name">Jessica Randall</h1>
        <p class="hero-loaction">London, United Kingdom</p>
      </div>
      <blockquote class="quote">"Front-end developer and avid reader."</blockquote>
    </div>
    <ul>
      <li><button class="btn">GitHub</button></li>
      <li><button class="btn">Frontend Mentor</button></li>
      <li><button class="btn">LinkedIn</button></li>
      <li><button class="btn">Twitter</button></li>
      <li><button class="btn">Instagram</button></li>
    </ul>
  </article>

</main>
<footer class="attribution">
  Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
  Coded by <a href="https://github.com/Jayfx24">AE.O</a>.
</footer>
</body>
</html>
